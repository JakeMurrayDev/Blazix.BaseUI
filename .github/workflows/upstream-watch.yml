# Monthly upstream watch digest (issue #156), feeding the sync evaluation cadence decided on #149.
#
# Runs on GitHub Actions rather than a local schedule because the vendored `.base-ui` clone is
# gitignored and lives only on a maintainer's machine, where isolated worktree sessions cannot run
# git against it. The runner clones mui/base-ui directly instead, so the digest depends on neither
# that clone, nor a laptop being awake, nor session isolation.
#
# This job only reports. It never renders a sweep-or-skip verdict, and a non-empty delta is not a
# failure: the verdict stays with a human at each monthly evaluation, which remains runnable by hand
# if a digest is late.
name: Upstream Watch

on:
  pull_request:
    paths:
      - 'docs/upstream-pin.json'
      - 'scripts/upstream-watch-digest.mjs'
      - 'scripts/tests/upstream-watch-digest-tests.sh'
      - '.github/workflows/upstream-watch.yml'
  schedule:
    # 06:41 UTC on the 1st, ahead of the monthly evaluation and clear of the parity canary's slot.
    - cron: '41 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, and gh authenticates from GH_TOKEN, so the digest job's
          # issues: write token has no reason to sit in the local git config.
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the digest generator
        run: bash scripts/tests/upstream-watch-digest-tests.sh

  digest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The issue lookup and the create are separate commands, so a cron run overlapping a manual
    # dispatch could have both find nothing and both post. Queue instead of cancelling: a run that
    # is already mid-post should finish.
    concurrency:
      group: upstream-watch-digest
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, and gh authenticates from GH_TOKEN, so the digest job's
          # issues: write token has no reason to sit in the local git config.
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone upstream
        run: |
          repository="$(node -p "require('./docs/upstream-pin.json').upstreamRepository")"
          ref="$(node -p "require('./docs/upstream-pin.json').upstreamRef")"
          # Blobless and checkout-free: the digest reads commit subjects and changed paths only.
          git clone --filter=blob:none --no-checkout --branch "$ref" \
            "https://github.com/$repository.git" upstream
      - name: Build the digest
        run: |
          node scripts/upstream-watch-digest.mjs \
            --upstream upstream \
            --repository "${{ github.repository }}" \
            --issue-title title.txt \
            --issue-body body.md \
            --quiet
      - name: Append the run link
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf '\n[View workflow run](%s)\n' "$RUN_URL" >> body.md
      - name: Post the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat title.txt)"
          # One digest issue per month. A manual re-run inside the same month refreshes that issue
          # instead of posting a second one; the next month's title claims its own. The helper is
          # shared with the parity canary and matches the title exactly.
          # --limit paginates internally. The label is shared with cycle epics and sweep tickets,
          # and the list comes back newest-first, so this only truncates if 1000 upstream-sync
          # issues were opened after this month's digest. Listing the label rather than searching
          # the title is deliberate: search indexing lags issue creation, and a lookup that misses
          # a just-created issue posts a duplicate.
          gh issue list --state all --label upstream-sync --limit 1000 --json number,title > issues.json
          number="$(node scripts/parity-canary-issue-number.mjs issues.json "$title")"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --label upstream-sync --body-file body.md
          fi
